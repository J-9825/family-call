name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk git zip unzip build-essential libssl-dev zlib1g-dev python3-pip python3-dev autoconf libtool pkg-config libncurses5-dev libncursesw5-dev libffi-dev libsqlite3-dev wget curl

      - name: Install build toolchain
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.37 python-for-android==2023.9.16

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-call-apk
          path: bin/*.apk
